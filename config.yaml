# Lunar Lander RL Lab - Base Configuration

experiment_name: baseline

environment:
  id: LunarLander-v3
  render_mode: null
  seed: 42
  continuous: false
  gravity: -10.0
  enable_wind: false
  wind_power: 15.0
  turbulence_power: 1.5

agent:
  algorithm: PPO
  policy: MlpPolicy
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch: [64, 64]

training:
  total_timesteps: 300000
  save_frequency: 25000
  log_interval: 10
  checkpoint_dir: models/baseline/checkpoints
  model_dir: models/baseline
  tensorboard_log: logs/tensorboard/baseline

evaluation:
  episodes: 100
  deterministic: true
  render_mode: null
  seed: 12345
  results_dir: results/metrics

reward:
  type: baseline # options: baseline, reward_hacking, corrected_reward
  time_penalty: 0.0
  upright_bonus: 0.0
  velocity_bonus: 0.0
  angle_threshold: 0.2
  velocity_threshold: 0.3
  progress_scale: 1.0
  crash_penalty: 100.0
  landing_bonus: 100.0

visualization:
  plots_dir: results/plots
  videos_dir: results/videos
