# Reward Hacking Experiment Configuration
# Intentionally flawed reward: rewards desirable state per-frame (upright, low velocity)
# creating perverse incentives to hover or delay landing rather than touch down.
experiment_name: reward_hacking

training:
  total_timesteps: 300000
  save_frequency: 25000
  checkpoint_dir: models/reward_hacking/checkpoints
  model_dir: models/reward_hacking
  tensorboard_log: logs/tensorboard/reward_hacking

reward:
  type: reward_hacking
  description: "Flawed reward providing static bonuses per frame for upright posture and low velocity"
  upright_bonus: 0.5
  velocity_bonus: 0.5
  angle_threshold: 0.2
  velocity_threshold: 0.25
  time_penalty: 0.0
