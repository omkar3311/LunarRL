# Corrected Reward Experiment Configuration
# Well-engineered reward shaping:
# 1. Potential/progress-based reward instead of static state reward
# 2. Small time penalty to discourage indefinite hovering
# 3. Explicit landing and stability incentives without overpowering native dynamics
experiment_name: corrected_reward

training:
  total_timesteps: 300000
  save_frequency: 25000
  checkpoint_dir: models/corrected_reward/checkpoints
  model_dir: models/corrected_reward
  tensorboard_log: logs/tensorboard/corrected_reward

reward:
  type: corrected_reward
  description: "Progress-based potential shaping with time penalty and safe touchdown incentives"
  time_penalty: 0.04
  progress_scale: 1.5
  velocity_alignment_weight: 0.5
  safe_landing_bonus: 50.0
  crash_penalty: 50.0
